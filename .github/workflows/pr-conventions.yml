# Conventions des pull requests (CONTRIBUTING.md, LUN-60).
#
# Refuse une PR qui ne respecte pas la stratégie de branches :
#   feat/, fix/, docs/, infra/, chore/LUN-<n>-<description>  → develop
#   hotfix/LUN-<n>-<description>                             → main
#   develop → staging (promotion en recette), staging → main (mise en production)
#   main → staging ou develop (report d'un correctif urgent)
# et, pour une PR de ticket :
#   - un titre au format d'un commit, terminé par la clé Jira de la branche :
#     « feat(api): pointage groupé (LUN-65) ». La clé relie la PR au ticket dans
#     Jira (numéro sans zéro devant : Jira écrit LUN-60, pas LUN-060) ;
#   - le modèle de PR rempli : ligne du ticket renseignée (plus de « LUN-<n> : »),
#     section « Ce qui change » qui ne se réduit pas à « - » (LUN-145, après une
#     PR de stage restée au modèle).
# Les PR de promotion n'ont pas de ticket propre.
#
# Aucune action tierce : un script shell suffit. Les valeurs fournies par
# l'auteur de la PR (nom de branche, titre) passent par des variables
# d'environnement, jamais directement dans le script (injection de commandes).
name: Conventions de PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventions:
    name: Branche, cible et titre
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Vérifier la branche, la cible et le titre
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          ticket='LUN-[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*'
          case "$BASE/$HEAD" in
            develop/main | staging/main | staging/develop | main/staging)
              # Promotion ou report d'un correctif : pas de ticket propre.
              echo "Promotion ou report : $HEAD → $BASE"; exit 0 ;;
            develop/*)
              echo "$HEAD" | grep -Eq "^(feat|fix|docs|infra|chore)/$ticket$" \
                || fail "Branche « $HEAD » : attendu feat|fix|docs|infra|chore/LUN-<n>-<description-en-minuscules> (CONTRIBUTING.md)" ;;
            main/*)
              echo "$HEAD" | grep -Eq "^hotfix/$ticket$" \
                || fail "Seules staging (mise en production) et hotfix/LUN-<n>-… entrent dans main" ;;
            staging/*)
              fail "Seules develop (promotion) et main (report d'un correctif) entrent dans staging" ;;
            *)
              fail "Cible « $BASE » inattendue : develop, staging ou main" ;;
          esac
          # Titre : type(portée facultative): description (LUN-<n>), types de CONTRIBUTING § 4.
          types='feat|fix|docs|refactor|test|chore|ci|perf|build|revert'
          echo "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: [^ ].* \(LUN-[1-9][0-9]*\)$" \
            || fail "Titre « $TITLE » : attendu type(portée): description (LUN-<n>), par exemple « feat(api): pointage groupé (LUN-65) » (CONTRIBUTING.md § 4)"
          key=$(echo "$HEAD" | sed -E 's#^[a-z]+/(LUN-[0-9]+)-.*#\1#')
          case "$TITLE" in
            *"($key)") ;;
            *) fail "Le titre doit finir par la clé de la branche : ($key)" ;;
          esac
          # Modèle de PR : rempli, pas laissé tel quel.
          body=${BODY//$'\r'/}
          # Ligne du ticket laissée telle quelle (le texte de la PR peut citer « LUN-<n> » ailleurs).
          if grep -q '^LUN-<n> :' <<<"$body"; then
            fail "Modèle de PR non rempli : remplacer « LUN-<n> » par la clé et le lien du ticket"
          fi
          # Lignes utiles de « Ce qui change » (ni vides, ni « - » seul, ni commentaire).
          # Redirections plutôt que tubes : avec pipefail, un grep -q qui s'arrête tôt
          # ferait échouer le tube et sauter le contrôle.
          changes=$(awk '/^## /{in_section=($0=="## Ce qui change"); next} in_section' <<<"$body" \
            | grep -Ev '^[[:space:]]*(-[[:space:]]*)?$|^[[:space:]]*<!--' || true)
          if grep -qx '## Ce qui change' <<<"$body" && [ -z "$changes" ]; then
            fail "Modèle de PR non rempli : décrire ce qui change, sous « Ce qui change »"
          fi
          echo "Conventions respectées : $HEAD → $BASE"
